<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Сообщаем браузеру, что сайт темный (убирает белые вспышки) -->
    <meta name="color-scheme" content="dark">
    
    <title>Yaroslav Dev.</title>

    <style>
      /* 1. Базовый фон (чтобы не было белого при загрузке) */
      html, body {
        background-color: #000000;
        margin: 0;
        padding: 0;
      }

      /* 2. ЯДЕРНЫЙ СТИЛЬ СКРОЛЛБАРА (Работает на всех элементах) */
      
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #27272a #000000;
      }

      /* Chrome, Edge, Safari, Opera */
      
      /* Ширина полосы */
      ::-webkit-scrollbar {
        width: 12px;
      }

      /* Фон (дорожка) */
      ::-webkit-scrollbar-track {
        background: #000000; 
      }

      /* Ползунок */
      ::-webkit-scrollbar-thumb {
        background-color: #27272a; /* Серый цвет */
        border-radius: 10px;       /* Закругление */
        border: 3px solid #000000; /* Черная обводка (создает отступ) */
      }

      /* Ползунок при наведении */
      ::-webkit-scrollbar-thumb:hover {
        background-color: #3b82f6; /* Синий при наведении */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
