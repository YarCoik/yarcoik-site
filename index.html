<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. ГЛАВНЫЙ ФИКС: Говорим браузеру, что сайт темный ЕЩЕ ДО ЗАГРУЗКИ СТИЛЕЙ -->
    <meta name="color-scheme" content="dark">
    
    <title>Yaroslav Dev.</title>

    <!-- 2. СТИЛИ ВНУТРИ HTML (Грузятся мгновенно) -->
    <style>
      :root {
        color-scheme: dark; /* Принудительно темная тема для скроллбара */
      }
      
      html, body {
        background-color: #000000; /* Черный фон сразу */
        margin: 0;
        padding: 0;
        scrollbar-width: thin; /* Firefox */
        scrollbar-color: #27272a #000000; /* Firefox */
      }

      /* Chrome, Edge, Safari */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #000000; 
      }
      ::-webkit-scrollbar-thumb {
        background-color: #27272a; 
        border-radius: 6px;
        border: 3px solid #000000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #3b82f6; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
